<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WrestleMania 39 - Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --gold: #caa24a;
    }

    body {
      background: black;
      color: white;
    }

    /* NAVBAR */
    .nav-glow {
      border-bottom: 2px solid var(--gold);
      background: rgba(0,0,0,0.9);
      position: relative;
    }

    .navbar-brand img {
      height: 50px;
      transition: transform 0.3s ease;
    }

    .navbar-brand img:hover {
      transform: scale(1.1);
    }

    /* HERO */
    .gallery-hero {
      background: url("Gbackground.jpg.jpg") center/cover no-repeat;
      min-height: 100vh;
      position: relative;
    }

    .gallery-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
    }

    .gallery-content {
      position: relative;
      z-index: 2;
      padding: 120px 0 80px;
      text-align: center;
    }

    .section-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    /* GRID */
    .gallery-grid img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid var(--gold);
      transition: 0.3s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--gold);
    }

    /* FOOTER */
    footer {
      background: #111;
      padding: 30px;
      text-align: center;
      border-top: 2px solid var(--gold);
    }

    .social-icons {
      margin-top: 10px;
    }

    .social-icons a {
      color: #aaa;
      font-size: 1.6rem;
      margin: 0 12px;
      transition: 0.3s ease;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: var(--gold);
      transform: scale(1.2);
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .section-title {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark nav-glow px-3">
  <div class="container-fluid position-relative">

    <!-- TOGGLER -->
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- CENTER LOGO -->
    <a href="index.html" class="navbar-brand position-absolute top-50 start-50 translate-middle">
      <img src="70494_WM37_logo_Final.jpg" alt="WWE Logo">
    </a>

    <!-- NAV LINKS -->
    <div class="collapse navbar-collapse justify-content-between" id="nav">

      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Synopsis</a></li>
        <li class="nav-item"><a class="nav-link" href="cast.html">Cast</a></li>
      </ul>

      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="videos.html">Videos</a></li>
      </ul>

    </div>
  </div>
</nav>

<!-- GALLERY -->
<main>
<section class="gallery-hero">

  <div class="gallery-content container">

    <h1 class="section-title">Gallery</h1>

    <div class="row g-4 gallery-grid">

      <div class="col-md-4">
        <img src="images/spear.jpg" alt="Roman Reigns Entrance">
      </div>

      <div class="col-md-4">
        <img src="images/Xroads.jpg" alt="Cody Rhodes Entrance">
      </div>

      <div class="col-md-4">
        <img src="images/Face2Face.jpg" alt="Face Off">
      </div>

      <div class="col-md-4">
        <img src="images/loss.jpg" alt="Match Moment">
      </div>

      <div class="col-md-4">
        <img src="images/wm39.jpg" alt="Crowd Reaction">
      </div>

      <div class="col-md-4">
        <img src="codywm39.jpg" alt="Match Action">
      </div>

    </div>

  </div>
</section>
</main>

<!-- FOOTER -->
<footer>
  <p>&copy; 2026 WrestleMania 39 Tribute Site | Not affiliated with WWE</p>

  <div class="social-icons">
    <a href="https://www.instagram.com/wwe/" target="_blank">
      <i class="bi bi-instagram"></i>
    </a>

    <a href="https://x.com/WWE" target="_blank">
      <i class="bi bi-twitter-x"></i>
    </a>

    <a href="https://www.youtube.com/@WWE" target="_blank">
      <i class="bi bi-youtube"></i>
    </a>

    <a href="https://www.wwe.com/" target="_blank">
      <i class="bi bi-globe"></i>
    </a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
