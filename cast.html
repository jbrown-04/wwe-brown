<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WrestleMania 39 - Cast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root { --gold: #caa24a; }

    body { background: black; color: white; }

    .nav-glow {
      border-bottom: 2px solid var(--gold);
      background: rgba(0,0,0,0.9);
      position: relative;
    }

    .navbar-brand img { height: 50px; transition: 0.3s; }
    .navbar-brand img:hover { transform: scale(1.1); }

    .cast-hero {
      background: url("background.jpg.jpg") center/cover no-repeat;
      min-height: 100vh;
      position: relative;
    }

    .cast-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
    }

    .cast-content {
      position: relative;
      z-index: 2;
      padding: 120px 0 80px;
      text-align: center;
    }

    .section-title {
      font-size: 3rem;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 40px;
      letter-spacing: 4px;
    }

    .cast-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    .card {
      background: rgba(0,0,0,0.75);
      border: 1px solid var(--gold);
      width: 280px;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(202,162,74,0.4);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
    }

    .gold { color: var(--gold); font-weight: bold; }

    footer {
      background: #111;
      padding: 30px;
      text-align: center;
      border-top: 2px solid var(--gold);
    }

    .social-icons a {
      color: #aaa;
      font-size: 1.6rem;
      margin: 0 12px;
      transition: 0.3s;
    }

    .social-icons a:hover {
      color: var(--gold);
      transform: scale(1.2);
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark nav-glow px-3">
  <div class="container-fluid position-relative">

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <a href="index.html" class="navbar-brand position-absolute top-50 start-50 translate-middle">
      <img src="70494_WM37_logo_Final.jpg">
    </a>

    <div class="collapse navbar-collapse justify-content-between" id="nav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Synopsis</a></li>
        <li class="nav-item"><a class="nav-link active" href="cast.html">Cast</a></li>
      </ul>

      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="videos.html">Videos</a></li>
      </ul>
    </div>
  </div>
</nav>

<main>
<section class="cast-hero">
  <div class="cast-content container">

    <h1 class="section-title">CAST</h1>

    <div class="cast-grid">

      <div class="card">
        <img src="images/roman.jpg">
        <div class="card-body">
          <div class="gold">Joe Anoa'i</div>
          <h5>Roman Reigns</h5>
        </div>
      </div>

      <div class="card">
        <img src="images/cody.jpg">
        <div class="card-body">
          <div class="gold">Cody Rhodes</div>
          <h5>The American Nightmare</h5>
        </div>
      </div>

    </div>

  </div>
</section>
</main>

<footer>
  <p>&copy; 2026 WrestleMania 39 Tribute Site</p>
  <div class="social-icons">
    <a href="https://www.instagram.com/wwe/"><i class="bi bi-instagram"></i></a>
    <a href="https://x.com/WWE"><i class="bi bi-twitter-x"></i></a>
    <a href="https://www.youtube.com/@WWE"><i class="bi bi-youtube"></i></a>
    <a href="https://www.wwe.com/"><i class="bi bi-globe"></i></a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
