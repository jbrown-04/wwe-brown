    :root {

    body {

    /* NAVBAR */
    .nav-glow {
      border-bottom: 2px solid var(--gold);
      background: rgba(0,0,0,0.9);
      position: relative;
    }

    .navbar-brand img {
      height: 50px;
      transition: transform 0.3s ease;
    }

      transform: scale(1.1);
    }

    /* HERO */
    .video-hero {
      background: url("2background.jpg.jpg") center/cover no-repeat;
      min-height: 100vh;
      position: relative;
    }

    .video-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.70);
    }

    .video-content {
      position: relative;
      z-index: 2;
      padding: 120px 0 80px;
      text-align: center;
    }

    .section-title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    /* VIDEO BOX */
    .video-box {
      border: 2px solid var(--gold);
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s ease;
      box-shadow: 0 0 15px rgba(202,162,74,0.3);
    }

    .video-box:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px var(--gold);
    }

    iframe {
      width: 100%;
      height: 250px;
      border: none;
    }

    /* FOOTER */
    footer {
      background: #111;
      padding: 30px;
      text-align: center;
      border-top: 2px solid var(--gold);
    }

    .social-icons {
      margin-top: 10px;
    }

    .social-icons a {
      color: #aaa;
      font-size: 1.6rem;
      margin: 0 12px;
      transition: 0.3s ease;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: var(--gold);
      transform: scale(1.2);
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .section-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
